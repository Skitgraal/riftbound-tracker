# Sources de la veille (Module 1). Voir docs/SOURCES.md.
# Ajouter une source d'un type déjà géré (kind) ne demande pas de code. Mettre enabled: false pour en couper une.

sources:
  - id: riot-news
    name: Site Riftbound — actualités
    kind: riot-news
    tier: official
    url: https://playriftbound.com/en-us/news/
    enabled: true
    # Tournois et règles : jamais de produit à suivre
    skip_categories: [organized_play]

  - id: riot-merch
    name: Boutique Riot — Riftbound
    kind: riot-merch
    tier: official
    url: https://merch.riotgames.com/en-us/category/riftbound/
    enabled: true

  # --- Relais : boutiques Shopify (liste JSON publique, robots.txt OK, testées depuis GitHub Actions le 24/11/2026) ---
  # Seules les collections Riftbound sont lues. Le prix d'une boutique va dans « Où l'acheter », jamais dans le prix officiel.

  - id: universe-tcg
    name: Universe TCG (Espagne)
    kind: shopify
    tier: relay
    url: https://www.universetcg.com/
    collections: [riftbound]
    currency: EUR
    enabled: true

  - id: cardcosmos
    name: Cardcosmos (Allemagne)
    kind: shopify
    tier: relay
    url: https://cardcosmos.de/
    collections: [riftbound-league-of-legends-trading-card-game, riftbound-release-2026, riftbound-legacy-kaufen, riftbound-set-7-the-reckoning]
    currency: EUR
    enabled: true

  - id: stomping-grounds
    name: Stompin' Grounds TCG (États-Unis)
    kind: shopify
    tier: relay
    url: https://www.stompinggroundstcg.com/
    collections: [riftbound]
    currency: USD
    enabled: true

  - id: face-to-face
    name: Face to Face Games (Canada)
    kind: shopify
    tier: relay
    url: https://facetofacegames.com/
    collections: [riftbound-sealed]
    currency: CAD
    enabled: true

  # --- Leaks : salons Discord de ton serveur (bot à créer, voir docs/SETUP.md). Inactive tant que DISCORD_BOT_TOKEN manque. ---
  # Le bot lit tous les salons texte qu'il voit : ceux où tu « suis » les annonces des serveurs Riftbound,
  # et ceux où tu colles un leak à la main. Les alertes de l'outil (webhooks) sont ignorées d'office.
  - id: discord-relay
    name: Discord — salons suivis
    kind: discord
    tier: leak
    url: https://discord.com/channels/@me
    exclude_channels: [alertes-critiques, fil]
    enabled: true
