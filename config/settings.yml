# Réglages globaux. Modifiables à la main, y compris depuis le site GitHub.

prices:
  # Alerte de variation du prix tendance
  alert_1d_pct: 10
  alert_7d_pct: 20
  # En dessous de ce prix (en euros), pas d'alerte de variation : évite le bruit des cartes à quelques centimes
  min_price_eur: 5
  # Versions non anglaises masquées par défaut dans le dashboard (le scellé anglais seul est suivi automatiquement)
  hide_language_tags: [ZH, FR, DE, IT, ES, JA, KO, PT]

watch:
  # LLM gratuit (API Gemini, offre gratuite) : modèle principal, puis modèle de secours si le premier est saturé
  llm_model: gemini-3.8-flash
  llm_fallback_model: gemini-3.5-flash-lite
  # Nombre maximal d'articles envoyés au LLM par passage (le reste attend le passage suivant)
  max_extractions_per_run: 6
  # Au tout premier passage, seuls les articles de moins de N jours sont lus
  bootstrap_days: 150
  # Sets annoncés mais pas encore au catalogue Cardmarket (ceux de Cardmarket sont ajoutés automatiquement)
  extra_sets: [The Reckoning]
  # Un article ne part à l'extraction que s'il contient au moins un de ces mots (insensible à la casse).
  # Les noms de sets connus (Origins, Spiritforged…) sont ajoutés automatiquement.
  keywords:
    - booster
    - display
    - bundle
    - box set
    - collection
    - edition
    - champion deck
    - showdown deck
    - precon
    - preorder
    - pre-order
    - drawing
    - raffle
    - merch store
    - msrp
    - release date
