<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Riftbound Tracker — Mobile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap">
<style>
body{margin:0;background:#0B0D12}
a{color:#7FE3D6}a:hover{color:#B5F0E8}
.chip{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border-radius:999px;font:600 11px/1 Inter,sans-serif;white-space:nowrap}
.chip-rumor{background:#2A2140;color:#C9B5FF}
.chip-announced{background:#1A2A45;color:#9CC3FF}
.chip-preorder{background:#3A2C12;color:#FFCB6B}
.chip-released{background:#123430;color:#7FE3D6}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:56px;color:#9AA3B5;text-decoration:none;font:500 11px/1 Inter,sans-serif}
.tab-on{color:#7FE3D6}
.art-a{background:#141A26}.art-b{background:#1A1626}.art-c{background:#121F1F}.art-d{background:#201A14}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0B0D12; color: #E8EAF0; font-family: Inter, sans-serif; display: flex; flex-direction: column; overflow: hidden">

  <header style="padding: 20px 20px 12px; display: flex; align-items: center; justify-content: space-between">
    <div style="display: flex; align-items: center; gap: 10px">
      <svg width="24" height="24" viewBox="0 0 28 28" fill="none" aria-hidden="true"><path d="M14 2 L24 14 L14 26 L4 14 Z" stroke="#4FD1C5" stroke-width="2"></path><path d="M14 8 L19 14 L14 20 L9 14 Z" fill="#4FD1C5"></path></svg>
      <span style="font: 700 18px/1 'Space Grotesk', sans-serif">Sorties</span>
    </div>
    <span style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: #9AA3B5"><span style="width: 7px; height: 7px; border-radius: 50%; background: #4FD1C5"></span>il y a 12 min</span>
  </header>

  <div style="flex: 1; overflow: hidden; padding: 4px 16px 16px; display: flex; flex-direction: column; gap: 20px">
    <a href="#" style="text-decoration: none; color: inherit; border-radius: 16px; background: #1C1710; border: 1px solid #4A3818; padding: 18px; display: flex; flex-direction: column; gap: 12px">
      <div style="color: #FFCB6B; font: 600 11px/1 Inter, sans-serif; letter-spacing: .08em; text-transform: uppercase">Tirage ouvert</div>
      <div style="font: 600 20px/1.2 'Space Grotesk', sans-serif">Coffret exclusif Riot</div>
      <div style="display: flex; align-items: center; justify-content: space-between">
        <span style="font-size: 13px; color: #C9BFA9">Ferme dans <span style="color: #FFE2A8; font-weight: 600">1 j 22 h</span></span>
        <span style="height: 36px; padding: 0 14px; border-radius: 9px; background: #FFCB6B; color: #1C1710; font: 600 13px/36px Inter, sans-serif">S'inscrire</span>
      </div>
    </a>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <div style="font: 600 12px/1 Inter, sans-serif; letter-spacing: .08em; text-transform: uppercase; color: #9AA3B5">À venir</div>
      <sc-for list="{{items}}" as="p" hint-placeholder-count="4">
        <a href="Product.dc.html" style="text-decoration: none; color: inherit; display: flex; gap: 14px; align-items: center; padding: 10px; border-radius: 14px; background: #12151C; border: 1px solid #232836">
          <div class="art-{{p.tone}}" style="width: 64px; height: 64px; border-radius: 10px; flex: none; display: grid; place-items: center; font: 700 18px/1 'Space Grotesk', sans-serif; color: #2E3648">{{p.mono}}</div>
          <div style="min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 5px">
            <div style="font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{p.name}}</div>
            <div style="font-size: 12px; color: #9AA3B5">{{p.date}}</div>
            <span class="chip chip-{{p.status}}" style="align-self: flex-start">{{p.statusLabel}}</span>
          </div>
        </a>
      </sc-for>
    </div>
  </div>

  <nav aria-label="Navigation principale" style="display: flex; border-top: 1px solid #1A1E28; background: #0E1016; padding-bottom: 8px">
    <a class="tab tab-on" href="#"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"></rect><path d="M3 9h18M8 2v4M16 2v4"></path></svg>Sorties</a>
    <a class="tab" href="#"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="13" r="8"></circle><path d="M12 9v4l2 2M9 2h6"></path></svg>Tirages</a>
    <a class="tab" href="Prices.dc.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 17l6-6 4 4 8-8M15 7h6v6"></path></svg>Prix</a>
    <a class="tab" href="#"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1 6.2L12 17.3 6.5 20.2l1-6.2L3 9.6l6.2-.9Z"></path></svg>Watchlist</a>
    <a class="tab" href="#"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 12h4l3-8 4 16 3-8h4"></path></svg>État</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      items: [
        { name: 'Set 3 Booster Box', date: '12 déc. 2026', status: 'preorder', statusLabel: 'Précommande', mono: 'S3', tone: 'b' },
        { name: 'Set 3 Champion Deck', date: '12 déc. 2026', status: 'announced', statusLabel: 'Annoncé', mono: 'S3', tone: 'b' },
        { name: 'Set 3 Sleeved Booster', date: 'T1 2027', status: 'rumor', statusLabel: 'Rumeur', mono: 'S3', tone: 'b' },
        { name: 'Spiritforged Booster Box', date: 'Sorti', status: 'released', statusLabel: 'Sorti', mono: 'SF', tone: 'c' }
      ]
    };
  }
}
</script>
</body>
</html>
