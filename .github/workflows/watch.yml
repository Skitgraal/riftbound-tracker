name: watch

# Veille des sorties, toutes les 2 h (minute 23 pour éviter les heures pleines, très chargées sur GitHub Actions).
on:
  schedule:
    - cron: '23 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

# Un seul workflow écrit dans data/ à la fois.
concurrency:
  group: data-writer
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Veille
        run: npm run watch -w collector
        env:
          DISCORD_WEBHOOK_CRITICAL: ${{ secrets.DISCORD_WEBHOOK_CRITICAL }}
          DISCORD_WEBHOOK_FEED: ${{ secrets.DISCORD_WEBHOOK_FEED }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Commit des données
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data
          if git diff --cached --quiet; then
            echo "Aucune donnée nouvelle."
            exit 0
          fi
          git commit -m "data: veille du $(TZ=Europe/Paris date '+%F %H:%M')"
          for attempt in 1 2 3; do
            git push && exit 0
            git pull --rebase
          done
          exit 1

  publish:
    needs: watch
    if: ${{ !cancelled() }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
