name: prices

# Ingestion Cardmarket, 3 fois par jour (heures UTC : 06:17, 14:17 et 22:17 à Paris en hiver, une heure plus tard en été).
# Idempotente : si Cardmarket n'a rien publié de nouveau, rien n'est commité.
on:
  schedule:
    - cron: '17 5,13,21 * * *'
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: "Simuler une panne (teste l'alerte d'échec, rien n'est commité)"
        type: boolean
        default: false

permissions:
  contents: write

# Un seul workflow écrit dans data/ à la fois.
concurrency:
  group: data-writer
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Ingestion Cardmarket
        run: npm run prices -w collector
        env:
          DISCORD_WEBHOOK_CRITICAL: ${{ secrets.DISCORD_WEBHOOK_CRITICAL }}
          DISCORD_WEBHOOK_FEED: ${{ secrets.DISCORD_WEBHOOK_FEED }}
          SIMULATE_FAILURE: ${{ inputs.simulate_failure }}

      # Même en cas d'échec : l'état des tâches (data/status.json) doit être enregistré. Sauf panne simulée.
      - name: Commit des données
        if: always() && inputs.simulate_failure != true
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data
          if git diff --cached --quiet; then
            echo "Aucune donnée nouvelle."
            exit 0
          fi
          git commit -m "data: prix Cardmarket du $(TZ=Europe/Paris date +%F)"
          for attempt in 1 2 3; do
            git push && exit 0
            git pull --rebase
          done
          exit 1

  # Republie le dashboard avec les nouvelles données (et l'état à jour, même après un échec).
  publish:
    needs: ingest
    if: ${{ !cancelled() && inputs.simulate_failure != true }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
