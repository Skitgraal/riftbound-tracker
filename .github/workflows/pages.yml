name: pages

# Publie le dashboard sur GitHub Pages.
# Déclenché par une modification du code ou de la config, et par les workflows de collecte après chaque passage.
on:
  push:
    branches: [main]
    paths: ['site/**', 'collector/**', 'config/**', 'package-lock.json', '.github/workflows/pages.yml']
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # main et non le commit déclencheur : appelé après une collecte, le site doit inclure les données qu'elle vient de committer.
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
